<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Point OCR to KML</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; line-height: 1.6; background-color: #f9f9f9; }
        h2 { color: #2E86C1; text-align: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* ปุ่มและ Input */
        input[type="file"] { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; cursor: pointer; }
        button { background-color: #28B463; color: white; border: none; padding: 12px 20px; cursor: pointer; font-size: 16px; border-radius: 6px; width: 100%; transition: 0.3s; margin-top: 10px;}
        button:hover { background-color: #239B56; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* ส่วนแสดงผล */
        #preview { max-width: 100%; max-height: 300px; object-fit: contain; display: block; margin: 10px auto; border-radius: 8px; border: 1px solid #ddd; display: none; }
        .status { text-align: center; font-weight: bold; color: #d35400; margin: 15px 0; }
        
        /* ตารางพิกัด */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        input.coord-input { width: 90%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .del-btn { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; width: auto; }
        
        textarea { width: 100%; margin-top: 10px; font-family: monospace; font-size: 12px; color: #555; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 สแกนพิกัดหลายจุด -> KML</h2>
    
    <label>1. เลือกรูปภาพตารางพิกัด</label>
    <input type="file" id="imageInput" accept="image/*">
    <img id="preview" alt="Image Preview">

    <p id="status" class="status"></p>

    <div id="resultSection" style="display:none;">
        <h3>2. ตรวจสอบข้อมูล (แก้ไขได้)</h3>
        <p style="font-size: 12px; color: #666;">*ระบบจะพยายามดึงตัวเลขที่เป็นคู่ในแต่ละบรรทัด</p>
        
        <table id="coordsTable">
            <thead>
                <tr>
                    <th width="10%">ที่</th>
                    <th>X / Lat</th>
                    <th>Y / Long</th>
                    <th width="10%">ลบ</th>
                </tr>
            </thead>
            <tbody id="coordsBody">
                </tbody>
        </table>
        
        <button onclick="addRow()" style="background-color: #3498DB; margin-top: 5px; width: auto; font-size: 14px;">+ เพิ่มแถวเอง</button>
        
        <hr>
        <button id="downloadBtn" onclick="generateKML()">🌍 ดาวน์โหลดไฟล์ KML (รวมทุกจุด)</button>
        
        <details style="margin-top: 20px;">
            <summary style="cursor: pointer; color: #999;">ดูข้อความดิบจาก OCR</summary>
            <textarea id="rawText" rows="5"></textarea>
        </details>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const resultSection = document.getElementById('resultSection');
    const coordsBody = document.getElementById('coordsBody');
    const rawText = document.getElementById('rawText');

    // เมื่อเลือกรูปภาพ
    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Reset หน้าจอ
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        coordsBody.innerHTML = ''; 
        resultSection.style.display = 'none';
        status.innerText = "⏳ กำลังอ่านตัวหนังสือ... (รอสักครู่)";

        try {
            // ใช้ Tesseract อ่าน (ตั้งค่าให้อ่านแบบ Block เพื่อรักษาบรรทัด)
            const worker = await Tesseract.createWorker('eng+tha'); // อ่านไทย+อังกฤษ
            
            // ตั้งค่า PSM 6 (Assume a single uniform block of text) เหมาะกับตาราง
            await worker.setParameters({
                tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
            });

            const ret = await worker.recognize(file);
            const text = ret.data.text;
            rawText.value = text; // เก็บข้อความดิบไว้ดู
            
            await worker.terminate();
            status.innerText = "✅ อ่านเสร็จสิ้น! กำลังแยกข้อมูล...";
            
            // ประมวลผลข้อความแยกเป็นบรรทัด
            processTextToTable(text);
            
            resultSection.style.display = 'block';
            status.innerText = "";

        } catch (err) {
            status.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
        }
    });

    function processTextToTable(text) {
        // แยกบรรทัดด้วย \n
        const lines = text.split('\n');
        let count = 0;

        lines.forEach(line => {
            // ลบตัวอักษรขยะ เหลือไว้แค่ ตัวเลข, จุด, และ ช่องว่าง
            let cleanLine = line.replace(/[^0-9\.\s]/g, ' ').trim();
            
            // Regex หาชุดตัวเลข (รองรับทั้งทศนิยม และ จำนวนเต็มยาวๆ แบบ UTM)
            // เช่น 100.453 หรือ 808194
            let matches = cleanLine.match(/(\d+\.\d+|\d{6,7})/g);

            // เงื่อนไข: ใน 1 บรรทัดต้องเจอตัวเลขอย่างน้อย 2 ชุด (X และ Y)
            if (matches && matches.length >= 2) {
                count++;
                // เลือก 2 ตัวเลขแรกที่เจอมาใส่
                let val1 = matches[0];
                let val2 = matches[1];

                addTableRow(count, val1, val2);
            }
        });

        if (count === 0) {
            alert("ไม่พบพิกัดที่ชัดเจน กรุณากรอกเองหรือลองครอบรูปให้เหลือแค่ตารางตัวเลข");
            addRow(); // เพิ่มแถวเปล่าให้ 1 แถว
        }
    }

    function addTableRow(index, x, y) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${index}</td>
            <td><input type="text" class="coord-input x-val" value="${x}"></td>
            <td><input type="text" class="coord-input y-val" value="${y}"></td>
            <td><button class="del-btn" onclick="this.closest('tr').remove()">ลบ</button></td>
        `;
        coordsBody.appendChild(row);
    }

    // ปุ่มเพิ่มแถวเอง
    function addRow() {
        const index = coordsBody.children.length + 1;
        addTableRow(index, "", "");
    }

    function generateKML() {
        const rows = document.querySelectorAll('#coordsBody tr');
        let placemarks = "";
        let pathCoordinates = "";

        rows.forEach((row, index) => {
            const x = row.querySelector('.x-val').value.trim();
            const y = row.querySelector('.y-val').value.trim();

            if(x && y) {
                // สร้าง Placemark แต่ละจุด
                placemarks += `
                <Placemark>
                    <name>จุดที่ ${index + 1}</name>
                    <Point><coordinates>${x},${y},0</coordinates></Point>
                </Placemark>`;
                
                // เก็บค่าสำหรับลากเส้นเชื่อม (Path)
                pathCoordinates += `${x},${y},0 \n`;
            }
        });

        if (placemarks === "") {
            alert("ไม่มีข้อมูลพิกัด");
            return;
        }

        // โครงสร้าง KML (รวมจุด และ เส้นทางเดิน)
        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
    <name>Exported Coordinates</name>
    ${placemarks}
    <Placemark>
        <name>Path Line</name>
        <LineString>
            <tessellate>1</tessellate>
            <coordinates>
                ${pathCoordinates}
            </coordinates>
        </LineString>
    </Placemark>
</Document>
</kml>`;

        // ดาวน์โหลด
        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "my_coordinates.kml";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
