<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandMap PWA</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body { font-family: system-ui, sans-serif; background:#f5f7fa; }
    .card { max-width:420px; margin:30px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.08); }
    h1 { text-align:center; }
    input, button { width:100%; padding:10px; margin-top:8px; font-size:16px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ddd; padding:6px; text-align:center; }
    button { background:#1976d2; color:white; border:none; border-radius:8px; }
  </style>
</head>
<body>
<div class="card">
  <h1>📍 LandMap PWA</h1>

  <!-- 1. Upload image -->
  <input type="file" accept="image/*" id="imageInput" />
  <p id="exifText">ยังไม่พบพิกัดจากรูป</p>

  <!-- 2. Editable coordinates -->
  <input id="lat" placeholder="Latitude" />
  <input id="lon" placeholder="Longitude" />
  <button onclick="addPoint()">➕ เพิ่มจุดพิกัด</button>

  <!-- 3. Point list -->
  <table>
    <thead><tr><th>#</th><th>Lat</th><th>Lon</th></tr></thead>
    <tbody id="points"></tbody>
  </table>

  <!-- 4. Export KMZ -->
  <button onclick="exportKMZ()">⬇️ Export KMZ</button>
</div>

<script src="https://unpkg.com/exifr/dist/lite.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let coords = [];

// 1. Read EXIF GPS
imageInput.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const exif = await exifr.gps(file);
  if (exif?.latitude) {
    lat.value = exif.latitude;
    lon.value = exif.longitude;
    exifText.textContent = `อ่านค่าจากรูป: ${exif.latitude}, ${exif.longitude}`;
  } else {
    exifText.textContent = 'รูปนี้ไม่มี GPS EXIF';
  }
};

// 2–3. Add & edit points
function addPoint() {
  if (!lat.value || !lon.value) return alert('กรอกพิกัดก่อน');
  coords.push({ lat: lat.value, lon: lon.value });
  render();
}

function render() {
  points.innerHTML = '';
  coords.forEach((p,i)=>{
    points.innerHTML += `<tr><td>${i+1}</td><td>${p.lat}</td><td>${p.lon}</td></tr>`;
  });
}

// 4. Export KMZ
async function exportKMZ() {
  if (coords.length === 0) return alert('ไม่มีจุดพิกัด');
  let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>`;
  coords.forEach((p,i)=>{
    kml += `<Placemark><name>Point ${i+1}</name><Point><coordinates>${p.lon},${p.lat},0</coordinates></Point></Placemark>`;
  });
  kml += '</Document></kml>';

  const zip = new JSZip();
  zip.file('doc.kml', kml);
  const blob = await zip.generateAsync({ type:'blob' });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landmap.kmz';
  a.click();
}
</script>
</body>
</html>
