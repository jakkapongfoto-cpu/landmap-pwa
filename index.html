<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scanner (V8: Auto-Select)</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        
        .box { background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d2e3fc; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-top: 5px;}
        .status-wait { background: #eee; color: #555; }
        .status-ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .upload-area { border: 2px dashed #1a73e8; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: white; transition: 0.2s; }
        .upload-area:hover { background: #f1f3f4; }
        
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #1a73e8; color: white; padding: 10px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        input.coord { width: 100%; text-align: center; border: none; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 AI Scanner (V8)</h2>
    
    <div class="box">
        <label>🔑 API Key:</label>
        <input type="password" id="apiKey" placeholder="วาง API Key แล้วรอสักครู่...">
        <div id="connectionStatus" class="status-badge status-wait">รอการเชื่อมต่อ...</div>
    </div>

    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        📂 จิ้มเพื่อเลือกรูปภาพ
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <img id="preview" style="max-width:100%; display:none; margin-top:10px; border-radius:5px;">
    </div>

    <button id="scanBtn" onclick="startScan()" disabled>🚀 เริ่มสแกน</button>
    <p id="msg" style="text-align:center; font-size:14px; color:#555;"></p>

    <div id="resultArea" style="display:none;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>X (Easting)</th>
                    <th>Y (Northing)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <button onclick="downloadKML()" style="background:#28a745; margin-top:10px;">🌍 ดาวน์โหลด KML</button>
    </div>
</div>

<script>
    const apiKeyInput = document.getElementById('apiKey');
    const statusBadge = document.getElementById('connectionStatus');
    const scanBtn = document.getElementById('scanBtn');
    const msg = document.getElementById('msg');
    let base64Image = "";
    let selectedModel = ""; // ตัวแปรเก็บชื่อโมเดลที่ใช้ได้จริง

    // โหลด Key เดิม
    window.onload = () => {
        const savedKey = localStorage.getItem("geminiApiKey");
        if(savedKey) {
            apiKeyInput.value = savedKey;
            checkModelAvailability(savedKey);
        }
    }

    apiKeyInput.addEventListener('input', (e) => checkModelAvailability(e.target.value));

    // ฟังก์ชันสำคัญ: หาโมเดลที่ใช้ได้จริงอัตโนมัติ
    async function checkModelAvailability(key) {
        if(key.length < 30) return;
        statusBadge.innerText = "⏳ กำลังค้นหาโมเดล...";
        statusBadge.className = "status-badge status-wait";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await response.json();

            if(data.error) throw new Error(data.error.message);

            // กรองหาเฉพาะโมเดลที่ "อ่านรูปได้" (generateContent)
            const validModels = data.models.filter(m => 
                m.supportedGenerationMethods && 
                m.supportedGenerationMethods.includes("generateContent")
            );

            if(validModels.length > 0) {
                // สูตรเลือกโมเดล: พยายามหาตัว Pro หรือ 1.5 ก่อน ถ้าไม่มีเอาตัวไหนก็ได้
                const bestModel = validModels.find(m => m.name.includes("gemini-1.5-pro")) || 
                                  validModels.find(m => m.name.includes("gemini-pro")) || 
                                  validModels[0];
                
                selectedModel = bestModel.name.replace("models/", ""); // เก็บชื่อรุ่นไว้ใช้
                
                statusBadge.innerText = `✅ พร้อมใช้งาน (รุ่น: ${selectedModel})`;
                statusBadge.className = "status-badge status-ok";
                localStorage.setItem("geminiApiKey", key);
                checkReady();
            } else {
                throw new Error("ไม่พบโมเดลที่รองรับการอ่านรูปภาพ");
            }
        } catch (err) {
            statusBadge.innerText = "❌ Error: " + err.message;
            statusBadge.className = "status-badge status-err";
            scanBtn.disabled = true;
        }
    }

    // จัดการรูปภาพ
    document.getElementById('imageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
            base64Image = reader.result.split(',')[1];
            document.getElementById('preview').src = reader.result;
            document.getElementById('preview').style.display = 'block';
            checkReady();
        };
        reader.readAsDataURL(file);
    });

    function checkReady() {
        if(selectedModel && base64Image) scanBtn.disabled = false;
    }

    async function startScan() {
        scanBtn.disabled = true;
        msg.innerText = `กำลังส่งข้อมูลไปให้ AI (${selectedModel})...`;
        document.getElementById('tableBody').innerHTML = '';

        const prompt = "Extract X and Y coordinates from this table. Return ONLY a JSON array like [[808194, 1456852], ...]. No markdown.";

        try {
            // ใช้ชื่อโมเดลที่หามาได้จริงๆ (selectedModel)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKeyInput.value}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            if(data.error) throw new Error(data.error.message);

            let text = data.candidates[0].content.parts[0].text;
            text = text.replace(/```json/g, '').replace(/```/g, '').trim();
            const coords = JSON.parse(text);

            msg.innerText = `✅ สำเร็จ! พบ ${coords.length} จุด`;
            
            coords.forEach((c, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${i+1}</td><td><input type="text" class="coord val-x" value="${c[0]}"></td><td><input type="text" class="coord val-y" value="${c[1]}"></td>`;
                document.getElementById('tableBody').appendChild(tr);
            });
            document.getElementById('resultArea').style.display = 'block';

        } catch (err) {
            msg.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
            alert("Error: " + err.message);
        } finally {
            scanBtn.disabled = false;
        }
    }

    function downloadKML() {
        let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>`;
        document.querySelectorAll('#tableBody tr').forEach((r, i) => {
            const x = r.querySelector('.val-x').value;
            const y = r.querySelector('.val-y').value;
            kml += `<Placemark><name>P${i+1}</name><Point><coordinates>${x},${y},0</coordinates></Point></Placemark>`;
        });
        kml += `</Document></kml>`;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([kml], { type: 'application/xml' }));
        link.download = "data.kml";
        link.click();
    }
</script>

</body>
</html>
