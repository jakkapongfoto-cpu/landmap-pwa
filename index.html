<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>📍 LandMap PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- EXIF -->
  <script src="https://unpkg.com/exif-js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn {
      background: #1976d2;
      color: white;
    }
    .btn-add {
      background: #2e7d32;
      color: white;
    }
    ul {
      padding-left: 18px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 LandMap PWA</h2>

  <input type="file" accept="image/*" id="imageInput">

  <label>Latitude</label>
  <input id="lat" placeholder="Latitude">

  <label>Longitude</label>
  <input id="lng" placeholder="Longitude">

  <button class="btn-add" onclick="addPoint()">➕ เพิ่มจุดพิกัด</button>

  <ul id="pointList"></ul>

  <button class="btn" onclick="exportKMZ()">⬇ Export KMZ</button>
</div>

<script>
let points = [];

document.getElementById("imageInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  EXIF.getData(file, function () {
    const lat = EXIF.getTag(this, "GPSLatitude");
    const lng = EXIF.getTag(this, "GPSLongitude");
    const latRef = EXIF.getTag(this, "GPSLatitudeRef");
    const lngRef = EXIF.getTag(this, "GPSLongitudeRef");

    if (!lat || !lng) {
      alert("❌ รูปนี้ไม่มี GPS (ต้องเปิด Location ตอนถ่าย)");
      return;
    }

    const latitude = convertDMSToDD(lat, latRef);
    const longitude = convertDMSToDD(lng, lngRef);

    document.getElementById("lat").value = latitude.toFixed(6);
    document.getElementById("lng").value = longitude.toFixed(6);
  });
});

function convertDMSToDD(dms, ref) {
  let dd = dms[0] + dms[1]/60 + dms[2]/3600;
  if (ref === "S" || ref === "W") dd *= -1;
  return dd;
}

function addPoint() {
  const lat = document.getElementById("lat").value;
  const lng = document.getElementById("lng").value;
  if (!lat || !lng) return alert("กรอกพิกัดก่อน");

  points.push({ lat, lng });
  renderList();
}

function renderList() {
  const ul = document.getElementById("pointList");
  ul.innerHTML = "";
  points.forEach((p, i) => {
    ul.innerHTML += `<li>จุด ${i+1}: ${p.lat}, ${p.lng}</li>`;
  });
}

function exportKMZ() {
  if (points.length === 0) return alert("ยังไม่มีจุดพิกัด");

  let placemarks = points.map((p, i) => `
    <Placemark>
      <name>Point ${i+1}</name>
      <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>
    </Placemark>
  `).join("");

  const kml = `
  <?xml version="1.0" encoding="UTF-8"?>
  <kml xmlns="http://www.opengis.net/kml/2.2">
    <Document>${placemarks}</Document>
  </kml>`;

  const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "landmap.kml";
  a.click();
}
</script>

</body>
</html>
