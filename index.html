<script>
imageInput.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  // 1) พยายามอ่าน EXIF ก่อน
  const exif = await exifr.gps(file);
  if (exif?.latitude) {
    lat.value = exif.latitude;
    lon.value = exif.longitude;
    exifText.textContent = `อ่านจาก EXIF: ${exif.latitude}, ${exif.longitude}`;
    return;
  }

  // 2) ถ้าไม่มี EXIF → ใช้ OCR
  exifText.textContent = 'ไม่พบ EXIF → AI กำลังอ่านตัวหนังสือจากภาพ...';

  const result = await Tesseract.recognize(file, 'eng+tha');
  const text = result.data.text.replace(/,/g,'.');

  // ดึงตัวเลขลักษณะพิกัด
  const nums = text.match(/[-+]?\d{1,3}\.\d+/g);

  if (!nums || nums.length < 2) {
    exifText.textContent = 'ไม่พบค่าพิกัดจาก OCR';
    return;
  }

  let latVal=null, lonVal=null;
  nums.forEach(n=>{
    const v=parseFloat(n);
    if(v>=-90 && v<=90 && latVal===null) latVal=v;
    else if(v>=-180 && v<=180 && lonVal===null) lonVal=v;
  });

  if(latVal!==null && lonVal!==null){
    lat.value=latVal;
    lon.value=lonVal;
    exifText.textContent = `อ่านจาก OCR: ${latVal}, ${lonVal}`;
  } else {
    exifText.textContent = 'พบตัวเลข แต่ไม่เข้าเงื่อนไขพิกัด';
  }
};
</script>
