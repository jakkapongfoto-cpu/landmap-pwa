<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LandMap PWA</title>

  <!-- EXIF Reader -->
  <script src="https://unpkg.com/exifr/dist/lite.umd.js"></script>

  <!-- JSZip (ทำ KMZ) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      border: none;
      border-radius: 8px;
      background: #e0e0e0;
      cursor: pointer;
    }
    button.primary {
      background: #1976d2;
      color: #fff;
    }
    small {
      color: #666;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>📍 LandMap PWA</h1>

  <input type="file" accept="image/*" capture="environment" id="photoInput">

  <small>เลือกรูปหรือถ่ายรูป (ต้องเปิด Location ตอนถ่าย)</small>

  <input type="number" step="any" id="lat" placeholder="Latitude">
  <input type="number" step="any" id="lng" placeholder="Longitude">

  <button class="primary" onclick="exportKMZ()">⬇️ Export KMZ</button>
</div>

<script>
const input = document.getElementById("photoInput");
const latInput = document.getElementById("lat");
const lngInput = document.getElementById("lng");

input.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const gps = await exifr.gps(file);

  if (!gps || !gps.latitude || !gps.longitude) {
    alert("❌ ไม่พบพิกัดในรูป (อาจปิด GPS ตอนถ่าย หรือรูปถูกบีบอัด)");
    return;
  }

  latInput.value = gps.latitude.toFixed(6);
  lngInput.value = gps.longitude.toFixed(6);
});

function exportKMZ() {
  const lat = latInput.value;
  const lng = lngInput.value;

  if (!lat || !lng) {
    alert("กรุณาใส่พิกัดก่อน");
    return;
  }

  const kml = `
<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Placemark>
    <name>LandMap Point</name>
    <Point>
      <coordinates>${lng},${lat},0</coordinates>
    </Point>
  </Placemark>
</kml>
  `.trim();

  const zip = new JSZip();
  zip.file("doc.kml", kml);

  zip.generateAsync({ type: "blob" }).then(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "landmap.kmz";
    a.click();
  });
}
</script>

</body>
</html>
