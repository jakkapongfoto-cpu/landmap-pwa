<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scanner (Auto-Detect Model)</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        
        .box { background: #f1f3f4; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #1a73e8; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: white; }
        
        .upload-btn { border: 2px dashed #1a73e8; background: #e8f0fe; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; color: #1a73e8; font-weight: bold; }
        .upload-btn:hover { background: #d2e3fc; }
        #preview { max-width: 100%; display: none; margin-top: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:disabled { background: #b0c4de; cursor: not-allowed; }
        .btn-check { background: #fbbc04; color: #333; margin-top: 5px; font-size: 14px; padding: 8px;}
        .btn-dl { background: #34a853; color: white; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #e8f0fe; padding: 10px; border: 1px solid #ddd; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        input.coord { width: 100%; border: none; text-align: center; font-family: monospace; font-size: 14px; }
        
        #status { text-align: center; margin: 15px 0; font-size: 14px; color: #555; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 AI Scanner (รุ่นแก้บั๊ก)</h2>
    
    <div class="box">
        <label>🔑 1. ใส่ API Key แล้วกดปุ่ม "เช็ครุ่น"</label>
        <input type="password" id="apiKey" placeholder="วางรหัส AIzaSy... ที่นี่">
        <button class="btn btn-check" onclick="checkAvailableModels()">🔄 กดปุ่มนี้เพื่อค้นหาว่าใช้รุ่นไหนได้บ้าง</button>
    </div>

    <div class="box">
        <label>🧠 2. เลือกรุ่น AI (ระบบจะดึงมาให้)</label>
        <select id="modelSelect">
            <option value="" disabled selected>กรุณากดปุ่มสีเหลืองด้านบนก่อน...</option>
        </select>
    </div>

    <div class="upload-btn" onclick="document.getElementById('imageInput').click()">
        📂 3. จิ้มเพื่อเลือกรูปภาพ
        <input type="file" id="imageInput" accept="image/*" style="display:none">
    </div>
    <img id="preview">

    <button id="scanBtn" class="btn btn-primary" onclick="startScan()" disabled>🚀 เริ่มสแกน</button>
    <p id="status"></p>

    <div id="resultArea" style="display:none;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th width="15%">#</th>
                    <th>X (Easting)</th>
                    <th>Y (Northing)</th>
                    <th width="15%">ลบ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <button class="btn btn-dl" onclick="downloadKML()">🌍 ดาวน์โหลด KML</button>
    </div>
</div>
