<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>OCR → X Y → KMZ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 6px 0; }
  </style>
</head>
<body>

<h2>อัปโหลดรูปภาพ → อ่านพิกัด → ส่งออก KMZ</h2>

<input type="file" id="imageInput" accept="image/*" />
<button onclick="runOCR()">อ่านตัวหนังสือจากรูป</button>

<p>ผลลัพธ์ OCR:</p>
<textarea id="ocrText" rows="4" cols="50"></textarea>

<hr />

<label>X:</label><br />
<input type="number" id="x" step="any"><br />
<label>Y:</label><br />
<input type="number" id="y" step="any"><br />

<button onclick="exportKMZ()">ดาวน์โหลดไฟล์ KMZ</button>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script>
async function runOCR() {
  const file = document.getElementById('imageInput').files[0];
  if (!file) return alert('กรุณาเลือกรูป');

  const { data: { text } } = await Tesseract.recognize(file, 'eng+tha');
  document.getElementById('ocrText').value = text;

  // ดึงตัวเลข 2 ค่าแรกเป็น X Y อัตโนมัติ
  const nums = text.match(/[-+]?\d*\.?\d+/g);
  if (nums && nums.length >= 2) {
    document.getElementById('x').value = nums[0];
    document.getElementById('y').value = nums[1];
  }
}

function exportKMZ() {
  const x = document.getElementById('x').value;
  const y = document.getElementById('y').value;

  if (!x || !y) return alert('กรุณากรอกพิกัด X Y');

  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.openes>${x},${y},0</coordinates>
    </Point>
  </Placemark>
</kml>`;

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const a = document.createElement= URL.createObjectURL(blob);
