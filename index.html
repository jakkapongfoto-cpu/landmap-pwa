<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR to KML (UTM Converter)</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f0f4f8; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        
        /* Control Box */
        .control-box { background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d2e3fc; }
        select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; font-weight: bold; color: #333; }
        
        .upload-area { border: 2px dashed #1a73e8; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; background: white; transition: 0.2s; margin-bottom: 15px;}
        .upload-area:hover { background: #f1f3f4; }
        #preview { max-width: 100%; display: none; margin-top: 10px; border-radius: 5px; }

        /* Progress */
        #progressContainer { display: none; margin: 15px 0; }
        #progressBar { width: 0%; height: 10px; background: #28a745; border-radius: 5px; transition: 0.3s; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #1a73e8; color: white; padding: 10px; }
        td { border: 1px solid #ddd; padding: 5px; text-align: center; }
        input.coord { width: 95%; text-align: center; border: 1px solid #ddd; padding: 5px; font-family: monospace; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-dl { background: #28a745; color: white; }
        .btn-del { background: #dc3545; color: white; padding: 5px 10px; font-size: 12px; width: auto; margin-top:0;}
        
        #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 OCR & แปลงพิกัด UTM</h2>
    
    <div class="control-box">
        <label>🌐 รูปแบบพิกัดในเอกสาร:</label>
        <select id="projSelect">
            <option value="utm47n" selected>UTM Zone 47N (ประเทศไทยส่วนใหญ่)</option>
            <option value="utm48n">UTM Zone 48N (ภาคอีสาน/ตะวันออกบางส่วน)</option>
            <option value="latlong">Latitude / Longitude (ทศนิยมปกติ)</option>
        </select>
        <p style="font-size: 12px; color: #666; margin-top: 5px;">*ถ้าพิกัดเป็นเลขหลักแสน/หลักล้าน ให้เลือก UTM</p>
    </div>

    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        📂 จิ้มเพื่อเลือกรูปภาพ
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <img id="preview">
    </div>

    <div id="progressContainer">
        <div id="progressBar"></div>
        <p id="statusText" style="text-align:center; font-size:12px;">กำลังประมวลผล...</p>
    </div>
    
    <canvas id="canvas"></canvas>

    <div id="resultArea" style="display:none;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th width="10%">#</th>
                    <th>X / Easting</th>
                    <th>Y / Northing</th>
                    <th width="15%">ลบ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        
        <button class="btn-dl" onclick="downloadKML()">🌍 แปลงค่า & ดาวน์โหลด KML</button>
        <button onclick="addEmptyRow()" style="background:#17a2b8; color:white;">+ เพิ่มแถว</button>
    </div>
</div>

<script>
    // --- ตั้งค่าระบบแปลงพิกัด (Proj4js) ---
    // UTM Zone 47N (ครอบคลุมภาคเหนือ, กลาง, ใต้เกือบหมด)
    proj4.defs("EPSG:32647","+proj=utm +zone=47 +datum=WGS84 +units=m +no_defs");
    // UTM Zone 48N (ครอบคลุมภาคอีสานฝั่งขวา, ตะวันออก)
    proj4.defs("EPSG:32648","+proj=utm +zone=48 +datum=WGS84 +units=m +no_defs");

    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const resultArea = document.getElementById('resultArea');
    const tableBody = document.getElementById('tableBody');
    const canvas = document.getElementById('canvas');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        resultArea.style.display = 'none';
        tableBody.innerHTML = '';
        document.getElementById('progressContainer').style.display = 'block';

        const processedImage = await preprocessImage(file);
        const worker = await Tesseract.createWorker('eng');
        
        await worker.setParameters({
            tessedit_char_whitelist: '0123456789. ', // อนุญาตจุดทศนิยมด้วย
            tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
        });

        const ret = await worker.recognize(processedImage, {
            logger: m => {
                if(m.status === 'recognizing text') {
                    document.getElementById('progressBar').style.width = (m.progress * 100) + '%';
                }
            }
        });

        await worker.terminate();
        document.getElementById('progressContainer').style.display = 'none';
        processTextToRows(ret.data.text);
        resultArea.style.display = 'block';
    });
