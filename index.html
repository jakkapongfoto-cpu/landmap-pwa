<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Photo to KML</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        h2 { color: #2E86C1; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="text"], textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; }
        button { background-color: #28B463; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; width: 100%; }
        button:hover { background-color: #239B56; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #preview { max-width: 100%; margin-top: 10px; border-radius: 4px; display: none; }
        .status { color: #d35400; font-weight: bold; margin: 10px 0; }
        .input-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📷 แปลงรูปถ่ายเป็นพิกัด KML</h2>
    
    <div class="input-group">
        <label>1. อัปโหลดรูปภาพที่มีพิกัด</label>
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" alt="Image Preview">
    </div>

    <p id="status" class="status"></p>

    <div class="input-group">
        <label>2. ข้อความที่อ่านได้ (แก้ไขได้)</label>
        <textarea id="ocrResult" rows="5" placeholder="ข้อความจากรูปจะปรากฏที่นี่..."></textarea>
    </div>

    <hr>

    <div class="input-group">
        <label>📍 พิกัด X (Longitude)</label>
        <input type="text" id="coordX" placeholder="เช่น 100.12345">
    </div>

    <div class="input-group">
        <label>📍 พิกัด Y (Latitude)</label>
        <input type="text" id="coordY" placeholder="เช่น 13.12345">
    </div>
    
    <div class="input-group">
        <label>🏷️ ชื่อจุด (Label)</label>
        <input type="text" id="pointName" value="My Point 01">
    </div>

    <button id="downloadBtn" onclick="generateKML()" disabled>🌍 ดาวน์โหลดไฟล์ KML</button>
</div>

<script>

    const ocrResult = document.getElementById('ocrResult');

    const downloadBtn = document.getElementById('downloadBtn');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // แสดงรูปตัวอย่าง
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        status.innerText = "⏳ กำลังอ่านข้อความจากภาพ (อาจใช้เวลาสักครู่)...";
        downloadBtn.disabled = true;
